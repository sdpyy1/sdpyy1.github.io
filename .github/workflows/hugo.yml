name: 部署博客网站

# 触发部署的条件
on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 新增：处理 CSDN 图片链接（下载到 static 并修改 md 文件）
      - name: 处理 CSDN 图片链接
        run: |
          # 安装 Python 依赖
          pip install requests

          # 创建 Python 处理脚本
          cat > process_images.py << 'EOF'
          import re
          import os
          import requests
          from pathlib import Path

          def process_md_files():
              # 配置路径
              md_root = "./content/post"  # md文件根目录
              static_dir = "./static"     # 图片保存目录

              # 创建static目录（如果不存在）
              os.makedirs(static_dir, exist_ok=True)

              # 匹配CSDN图片链接的正则表达式
              pattern = r'!\[(.*?)\]\(https://i-blog.csdnimg.cn/direct/(\w+)\.png\)'

              # 递归查找所有md文件
              md_files = list(Path(md_root).rglob("*.md"))
              if not md_files:
                  print("未找到.md文件")
                  return

              for md_file in md_files:
                  print(f"\n处理文件: {md_file}")
                  try:
                      content = md_file.read_text(encoding='utf-8')
                  except Exception as e:
                      print(f"  读取文件失败: {e}")
                      continue

                  # 查找所有匹配的图片链接
                  matches = re.findall(pattern, content)
                  if not matches:
                      print("  未找到CSDN图片链接")
                      continue

                  # 处理每个图片
                  for desc, img_id in matches:
                      img_filename = f"{img_id}.png"
                      img_url = f"https://i-blog.csdnimg.cn/direct/{img_filename}"
                      local_path = os.path.join(static_dir, img_filename)

                      # 检查是否已下载
                      if os.path.exists(local_path):
                          print(f"  图片已存在: {img_filename}")
                      else:
                          # 下载图片
                          try:
                              print(f"  下载图片: {img_url}")
                              response = requests.get(img_url, timeout=10, headers={
                                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/91.0.4472.124 Safari/537.36"
                              })
                              response.raise_for_status()
                              with open(local_path, 'wb') as f:
                                  f.write(response.content)
                              print(f"  下载成功: {img_filename}")
                          except Exception as e:
                              print(f"  下载失败: {img_url}，错误: {e}")
                              continue

                      # 替换md中的链接（Hugo中通常用/static/作为图片根路径）
                      old_link = f"![{desc}](https://i-blog.csdnimg.cn/direct/{img_filename})"
                      new_link = f"![{desc}](/static/{img_filename})"  # 适配Hugo的静态文件路径
                      content = content.replace(old_link, new_link)

                  # 保存修改后的md文件
                  try:
                      md_file.write_text(content, encoding='utf-8')
                      print(f"  文件更新完成: {md_file}")
                  except Exception as e:
                      print(f"  保存文件失败: {e}")

          if __name__ == "__main__":
              process_md_files()
          EOF

          # 运行处理脚本
          python process_images.py

      # 保留原有的复制png文件逻辑（处理已存在的本地图片）
      - name: 复制 post 中的 png 图片到 static 目录
        run: |
          mkdir -p ./static
          find ./content/post -type f -name "*.png" -exec cp {} ./static/ \;
          echo "已复制的图片文件："
          ls -l ./static/*.png

      - name: 安装Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.151.2'
          extended: true

      - name: 生成public文件夹
        run: hugo

      - name: 部署到GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public