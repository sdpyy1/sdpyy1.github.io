name: 部署博客网站并提交修改

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 处理 md 文件和本地图片（统一去空格）
        run: |
          cat > process_local_images.py << 'EOF'
          import re
          import os
          from pathlib import Path

          md_root = "./content/post"
          image_exts = ["png", "jpeg", "jpg", "gif", "webp"]

          def sanitize_filename(name):
              return name.replace(" ", "-")

          # 遍历所有 md 文件，替换图片链接空格
          for md_file in Path(md_root).rglob("*.md"):
              content = md_file.read_text(encoding='utf-8')
              pattern = r'!\[(.*?)\]\((.*?)\)'
              matches = re.findall(pattern, content)
              for desc, path in matches:
                  new_path = sanitize_filename(path)
                  if path != new_path:
                      content = content.replace(f']({path})', f']({new_path})')
              md_file.write_text(content, encoding='utf-8')

          # 遍历所有图片文件，重命名去空格
          for ext in image_exts:
              for img_file in Path(md_root).rglob(f"*.{ext}"):
                  new_name = sanitize_filename(img_file.name)
                  new_path = img_file.parent / new_name
                  if img_file != new_path:
                      os.rename(img_file, new_path)
          EOF
          python process_local_images.py

      - name: 复制 post 中的图片到 static 目录（不改名）
        run: |
          mkdir -p ./static
          find ./content/post -type f \( -name "*.png" -o -name "*.jpeg" -o -name "*.jpg" -o -name "*.gif" -o -name "*.webp" \) -exec cp {} ./static/ \;
          echo "已复制到 static 目录"

      - name: 提交修改后的 md 文件和图片
        run: |
          shopt -s nullglob
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          find ./content/post -type f -name "*.md" -print0 | xargs -0 git add
          git add ./content/post/*.{png,jpeg,jpg,gif,webp} 2>/dev/null
          git add ./static/*.{png,jpeg,jpg,gif,webp} 2>/dev/null
          if git diff --cached --quiet; then
              echo "无修改内容，无需提交"
          else
              git commit -m "统一去空格并更新图片链接"
              git push origin main
          fi

      - name: 安装Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.151.2'
          extended: true

      - name: 生成 public 文件夹
        run: hugo

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
