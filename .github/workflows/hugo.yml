name: 部署博客网站

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: 处理 CSDN 图片链接（支持多格式）
        run: |
          pip install requests

          cat > process_images.py << 'EOF'
          import re
          import os
          import requests
          from pathlib import Path

          def process_md_files():
              # 配置路径
              md_root = "./content/post"  # md文件根目录
              static_dir = "./static"     # 图片保存目录

              # 创建static目录
              os.makedirs(static_dir, exist_ok=True)

              # 匹配CSDN图片链接（支持png、jpeg、jpg格式）
              pattern = r'!\[(.*?)\]\(https://i-blog.csdnimg.cn/direct/(\w+)\.(png|jpeg|jpg)\)'

              # 递归查找所有md文件
              md_files = list(Path(md_root).rglob("*.md"))
              if not md_files:
                  print("未找到.md文件")
                  return

              for md_file in md_files:
                  print(f"\n处理文件: {md_file}")
                  try:
                      content = md_file.read_text(encoding='utf-8')
                  except Exception as e:
                      print(f"  读取文件失败: {e}")
                      continue

                  # 查找所有匹配的图片链接
                  matches = re.findall(pattern, content)
                  if not matches:
                      print("  未找到CSDN图片链接")
                      continue

                  # 处理每个图片（desc:描述, img_id:图片ID, ext:后缀）
                  for desc, img_id, ext in matches:
                      img_filename = f"{img_id}.{ext}"  # 拼接完整文件名（含后缀）
                      img_url = f"https://i-blog.csdnimg.cn/direct/{img_filename}"
                      local_path = os.path.join(static_dir, img_filename)

                      # 检查是否已下载
                      if os.path.exists(local_path):
                          print(f"  图片已存在: {img_filename}")
                      else:
                          # 下载图片（模拟浏览器请求头避免拦截）
                          try:
                              print(f"  下载图片: {img_url}")
                              headers = {
                                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/118.0.0.0 Safari/537.36"
                              }
                              response = requests.get(img_url, timeout=15, headers=headers)
                              response.raise_for_status()  # 抛出HTTP错误（如403、404）
                              with open(local_path, 'wb') as f:
                                  f.write(response.content)
                              print(f"  下载成功: {img_filename}")
                          except Exception as e:
                              print(f"  下载失败: {img_url}，错误: {e}")
                              continue  # 下载失败则不替换该链接

                      # 替换md中的链接为本地路径（适配Hugo）
                      old_link = f"![{desc}](https://i-blog.csdnimg.cn/direct/{img_filename})"
                      new_link = f"![{desc}](/static/{img_filename})"
                      content = content.replace(old_link, new_link)

                  # 保存修改后的md文件
                  try:
                      md_file.write_text(content, encoding='utf-8')
                      print(f"  文件更新完成: {md_file}")
                  except Exception as e:
                      print(f"  保存文件失败: {e}")

          if __name__ == "__main__":
              process_md_files()
          EOF

          # 运行处理脚本
          python process_images.py

      - name: 复制 post 中的图片到 static 目录
        run: |
          mkdir -p ./static
          # 复制所有常见图片格式（容错：即使无对应格式也不报错）
          find ./content/post -type f \( -name "*.png" -o -name "*.jpeg" -o -name "*.jpg" -o -name "*.gif" -o -name "*.webp" \) -exec cp {} ./static/ 2>/dev/null \;
          echo -e "\n已复制到 static 目录的图片文件："
          # 优化ls命令：用通配符匹配所有图片，不存在时不报错（2>/dev/null屏蔽错误）
          ls -l ./static/*.{png,jpeg,jpg,gif,webp} 2>/dev/null || echo "  无额外本地图片需要复制"

      - name: 安装Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.151.2'
          extended: true

      - name: 生成public文件夹
        run: hugo

      - name: 部署到GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public