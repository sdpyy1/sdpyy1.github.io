jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # 新增：复制 content/post 下的所有 xxxx.png 到 static 文件夹
      - name: 复制 post 中的 png 图片到 static 目录
        run: |
          # 创建 static 文件夹（防止不存在时报错）
          mkdir -p ./static
          # 递归查找 ./content/post 下所有 .png 文件，复制到 ./static（保持原文件名，重复文件会覆盖）
          find ./content/post -type f -name "*.png" -exec cp {} ./static/ \;
          # 可选：输出复制结果，方便调试（查看复制了哪些文件）
          echo "已复制的图片文件："
          ls -l ./static/*.png

      - name: 安装Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.151.2'
          extended: true

      - name: 生成public文件夹
        run: hugo

      - name: 部署到GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public