name: 部署博客网站并提交修改

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 处理 CSDN 图片链接（支持多格式）
        run: |
          pip install requests

          cat > process_images.py << 'EOF'
          # （脚本内容不变，省略）
          EOF

          python process_images.py

      - name: 复制 post 中的图片到 static 目录
        run: |
          mkdir -p ./static
          find ./content/post -type f \( -name "*.png" -o -name "*.jpeg" -o -name "*.jpg" -o -name "*.gif" -o -name "*.webp" \) -exec cp {} ./static/ 2>/dev/null \;
          echo -e "\n已复制到 static 目录的图片文件："
          ls -l ./static/*.{png,jpeg,jpg,gif,webp} 2>/dev/null || echo "  无额外本地图片需要复制"

      - name: 提交修改后的 md 文件和图片
        run: |
          # 启用通配符容错：当无匹配文件时返回空（避免git add报错）
          shopt -s nullglob

          # 配置Git身份
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 递归添加所有修改的md文件（即使子目录）
          git add ./content/post/**/*.md 2>/dev/null
          
          # 添加static目录下的图片（自动忽略不存在的格式）
          git add ./static/*.png ./static/*.jpeg ./static/*.jpg ./static/*.gif ./static/*.webp 2>/dev/null
          
          # 检查是否有修改
          if git diff --cached --quiet; then
              echo "无修改内容，无需提交"
          else
              git commit -m "自动替换CSDN图片链接为本地链接"
              git push origin main
          fi

      - name: 安装Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.151.2'
          extended: true

      - name: 生成public文件夹
        run: hugo

      - name: 部署到GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public